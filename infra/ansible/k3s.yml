---
- name: Configure K3s control plane
  hosts: k3s_server
  become: true
  vars:
    k3s_unit: k3s
  tasks:
    - name: Require a pinned release
      ansible.builtin.assert:
        that:
          - k3s_version is defined
          - k3s_version is match('^v[0-9]+[.][0-9]+[.][0-9]+[+]k3s[0-9]+$')
    - name: Download the K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/sbin/install-k3s
        owner: root
        group: root
        mode: "0755"
    - name: Install the server on first bootstrap
      ansible.builtin.command:
        cmd: /usr/local/sbin/install-k3s server --node-ip {{ k3s_private_ip }}
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
    - name: Wait for the server token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 90
    - name: Read the worker join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_join_token
      no_log: true

- name: Join K3s worker
  hosts: k3s_worker
  become: true
  vars:
    k3s_server_host: "{{ groups['k3s_server'] | first }}"
    k3s_server_ip: "{{ hostvars[k3s_server_host].k3s_private_ip }}"
  tasks:
    - name: Download the K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/sbin/install-k3s
        owner: root
        group: root
        mode: "0755"
    - name: Create the worker configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0700"
    - name: Configure the worker to use the private control plane
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: "{{ {'server': 'https://' ~ k3s_server_ip ~ ':6443', 'node-ip': k3s_private_ip, 'token': hostvars[k3s_server_host].k3s_join_token.content | b64decode | trim} | to_nice_yaml }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
      notify: Restart K3s worker
    - name: Install the worker on first bootstrap
      ansible.builtin.command:
        cmd: /usr/local/sbin/install-k3s agent
        creates: /etc/systemd/system/k3s-agent.service
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
  handlers:
    - name: Restart K3s worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
